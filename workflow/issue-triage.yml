    - data:
        code: "\"\"\"Code node 1: route errors/security and collect conservative triage\
          \ signals.\"\"\"\nimport json\nimport re\n\n\ndef main(payload_json: str)\
          \ -> dict:\n    data = json.loads(payload_json)\n    if not data.get('ok'):\n\
          \        err = data.get('error', {})\n        return {'route':'stop','keywords':'','context_json':'{}','report':'##\
          \ Unable to retrieve issue\\n\\n' + err.get('message','Unexpected error.')\
          \ + '\\n\\nError code: ' + err.get('code','unknown') + '\\n\\nNo diagnosis\
          \ was generated.'}\n    issue = data['issue']\n    text = issue['title']\
          \ + '\\n' + issue['body'] + '\\n' + '\\n'.join(x['body'] for x in data.get('comments',[]))\n\
          \    if re.search(r'(?i)(expos\\w*.{0,60}(api.?key|token|secret)|other users?.{0,50}(key|token)|credential\
          \ leak|security vulnerability|unauthorized access|remote code execution)',\
          \ text):\n        return {'route':'stop','keywords':'','context_json':'{}','report':'##\
          \ Potential security report: private review required\\n\\nA keyword rule\
          \ flagged this report; this is not a confirmed vulnerability. Do not request\
          \ a public PoC, additional keys or exploitation details. Use the repository\\\
          's published private security reporting channel. Escalate to its security\
          \ maintainers.\\n\\n### Suggested public reply\\nThanks for flagging this.\
          \ Please avoid posting further reproduction details or credentials publicly.\
          \ Please use this repository\\'s Security policy or private vulnerability\
          \ reporting channel so the security team can investigate safely.\\n\\nIssue\
          \ text is intentionally omitted from this report. Dify execution logs can\
          \ still contain the tool output: restrict log access.'}\n    missing = []\n\
          \    if not re.search(r'(?i)\\b(?:v?\\d+\\.\\d+\\.\\d+)\\b',text):\n   \
          \     missing.append('Exact Dify version and plugin/provider version (and\
          \ previous version if this followed an upgrade)')\n    if not re.search(r'(?i)docker|self.host|dify\
          \ cloud|cloud.dify|kubernetes|\\bk8s\\b|source deployment',text):\n    \
          \    missing.append('Deployment type: Dify Cloud, Docker, Kubernetes, or\
          \ source deployment')\n    if not re.search(r'(?im)^\\s*(?:\\d+[.)]\\s+\\\
          S|curl\\s+\\S)|```(?:python|bash|json|sh)?\\s*\\n\\S',text):\n        missing.append('A\
          \ minimal reproducible input and exact steps, with expected and actual output')\n\
          \    if not re.search(r'(?i)traceback|request.?id\\s*[:=]\\s*\\S|\\b(?:400|401|403|404|429|500|502|503)\\\
          b|connection refused|timed? ?out',text):\n        missing.append('Exact\
          \ sanitized error and relevant node/service logs, including timestamp and\
          \ request/run ID')\n    category, checks, keywords = 'needs-investigation',\
          \ ['Reproduce with the smallest input and compare the expected result with\
          \ the first failing step.','Locate the boundary that fails before assigning\
          \ ownership to Dify, the plugin, or the upstream service.'], issue['title']\n\
          \    if re.search(r'(?i)429|rate.?limit|insufficient_quota',text):\n   \
          \     category='upstream-limit-or-quota'; keywords='429'\n        checks=['Inspect\
          \ the upstream error code: quota/billing exhaustion and request/token rate\
          \ limits require different fixes.','Compare provider project, model, concurrency,\
          \ retries, timestamps, and rate-limit headers.','Run one minimal provider\
          \ request from the same runtime/network with the same credential. Respect\
          \ Retry-After; never loop on exhausted quota.']\n    elif re.search(r'(?i)connection\
          \ refused|econnrefused',text):\n        category='connectivity'; keywords='connection\
          \ refused'\n        checks=['Identify the refusing host and port from sanitized\
          \ logs; a refused TCP connection happens before API-key validation.','Check\
          \ service health, container DNS/ports, and whether localhost refers to the\
          \ wrong container.','Compare the previous and current Dify/plugin-daemon\
          \ versions, release notes and effective environment configuration.']\n \
          \   elif re.search(r'(?i)401|unauthori[sz]ed|invalid.api.key',text):\n \
          \       category='authentication'; keywords='401'\n        checks=['Confirm\
          \ provider, endpoint and credential source without printing the token.','Check\
          \ expiry, permissions and selected project; compare one minimal request\
          \ from the same network.']\n    elif re.search(r'(?i)\\bapi\\b',text) and\
          \ re.search(r'(?i)empty|different|\\bui\\b',text):\n        category='ui-api-parity';\
          \ keywords='api empty'\n        checks=['Compare the UI draft with the published\
          \ workflow behind the API key, including app ID and publish time.','Compare\
          \ input names/types, user/conversation identity, file upload IDs and environment\
          \ variables.','Compare node traces and parse the final SSE event when response_mode\
          \ is streaming.']\n    elif re.search(r'(?i)documentation|\\bdocs?\\b',text):\n\
          \        category='documentation'; keywords='documentation'\n        checks=['Reproduce\
          \ the exact documented example on its stated version, starting with prerequisites.','If\
          \ version-specific, document the affected range and validate the correction\
          \ on supported versions.']\n    context={'repository':data['repository'],'issue':{k:issue[k]\
          \ for k in ['number','title','url','state','updated_at']},'category':category,'missing':missing,'checks':checks,'warnings':data.get('warnings',[])}\n\
          \    return {'route':'continue','keywords':keywords[:250],'context_json':json.dumps(context),'report':''}\n"
        code_language: python3
